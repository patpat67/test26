<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff6b9d 0%, #c44569 50%, #ff6b9d 100%);
            font-family: 'Georgia', serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #c44569;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .heart-icon {
            font-size: 80px;
            animation: pulse 1s ease-in-out infinite;
            display: block;
            margin-bottom: 20px;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .question {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .btn-yes {
            background: linear-gradient(135deg, #ff6b9d, #c44569);
            color: white;
        }

        .btn-yes:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 30px rgba(196, 69, 105, 0.4);
        }

        .btn-no {
            background: #ddd;
            color: #666;
            position: relative;
        }

        .celebration {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .celebration.show {
            display: block;
        }

        .celebration h2 {
            color: #c44569;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .celebration p {
            font-size: 1.3rem;
            color: #666;
            margin-bottom: 20px;
        }

        .celebration .heart-icon {
            font-size: 100px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .initial {
            display: block;
        }

        .initial.hide {
            display: none;
        }

        /* Floating hearts background */
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .floating-heart {
            position: absolute;
            font-size: 30px;
            animation: float-up 4s ease-in infinite;
            opacity: 0;
        }

        @keyframes float-up {
            0% {
                opacity: 0;
                transform: translateY(100vh) rotate(0deg);
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) rotate(360deg);
            }
        }

        /* Confetti for celebration */
        .confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: confetti-fall 3s ease-in-out infinite;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(-10px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="floating-hearts" id="floatingHearts"></div>
    <div class="confetti" id="confetti"></div>

    <div class="container">
        <div class="initial" id="initialContent">
            <span class="heart-icon">💕</span>
            <h1>Hey You...</h1>
            <p class="question">Will you be my Valentine?</p>
            <div class="buttons">
                <button class="btn btn-yes" onclick="sayYes()">Yes! 💖</button>
                <button class="btn btn-no" id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No</button>
            </div>
        </div>

        <div class="celebration" id="celebration">
            <span class="heart-icon">💖</span>
            <h2>Yay! You made me so happy!</h2>
            <p>I can't wait to spend Valentine's Day with you! 🥰</p>
            <p style="font-size: 3rem; margin-top: 20px;">💕🌹💕</p>
        </div>
    </div>

    <script>
        // Create floating hearts in background
        function createFloatingHearts() {
            const container = document.getElementById('floatingHearts');
            const hearts = ['💕', '❤️', '💖', '💗', '💓', '💘'];

            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('span');
                heart.className = 'floating-heart';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 4 + 's';
                heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
                container.appendChild(heart);
            }
        }

        // Move the "No" button when hovered
        let noButtonMoves = 0;
        function moveButton() {
            const btn = document.getElementById('noBtn');
            noButtonMoves++;

            // After a few attempts, make the button smaller
            if (noButtonMoves > 3) {
                btn.style.transform = `scale(${Math.max(0.3, 1 - noButtonMoves * 0.1)})`;
            }

            // Move to random position
            const maxX = window.innerWidth - 150;
            const maxY = window.innerHeight - 100;
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            btn.style.position = 'fixed';
            btn.style.left = randomX + 'px';
            btn.style.top = randomY + 'px';
            btn.style.zIndex = '100';

            // Change text based on attempts
            const texts = ['No', 'Are you sure?', 'Really?', 'Think again!', 'Please? 🥺', 'Pretty please?', '😢'];
            btn.textContent = texts[Math.min(noButtonMoves, texts.length - 1)];
        }

        // Handle "Yes" click
        function sayYes() {
            document.getElementById('initialContent').classList.add('hide');
            document.getElementById('celebration').classList.add('show');
            document.getElementById('noBtn').style.display = 'none';
            createConfetti();
        }

        // Create confetti celebration
        function createConfetti() {
            const container = document.getElementById('confetti');
            const colors = ['#ff6b9d', '#c44569', '#ff9a9e', '#ffd1d1', '#ff69b4', '#ffb6c1'];

            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti-piece';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 3 + 's';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                container.appendChild(confetti);
            }
        }

        // Initialize
        createFloatingHearts();
    </script>
</body>
</html>
