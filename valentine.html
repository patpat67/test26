<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Message In The Stars</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(to bottom, #0a0a1a 0%, #1a1a3a 50%, #0d0d2b 100%);
            font-family: 'Georgia', serif;
            overflow: hidden;
            cursor: crosshair;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .intro {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 100;
            color: white;
            animation: fadeIn 2s ease;
        }

        .intro h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            font-weight: normal;
            letter-spacing: 3px;
        }

        .intro p {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 30px;
        }

        .intro button {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.5);
            color: white;
            padding: 15px 40px;
            font-size: 1rem;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .intro button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: white;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }

        .hidden {
            display: none !important;
        }

        .hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 1rem;
            z-index: 50;
            text-align: center;
            transition: opacity 0.5s ease;
        }

        .progress {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
            z-index: 50;
            letter-spacing: 2px;
        }

        .message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 100;
            color: white;
            opacity: 0;
            transition: opacity 2s ease;
            pointer-events: none;
        }

        .message.show {
            opacity: 1;
            pointer-events: auto;
        }

        .message h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(255, 100, 150, 0.8);
            font-weight: normal;
            letter-spacing: 3px;
            color: #ffb6c1;
        }

        .message p {
            font-size: 1.5rem;
            opacity: 0.9;
            margin-bottom: 30px;
            line-height: 1.8;
        }

        .message .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 40px;
        }

        .message button {
            background: transparent;
            border: 1px solid rgba(255, 182, 193, 0.7);
            color: #ffb6c1;
            padding: 15px 50px;
            font-size: 1.2rem;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .message button:hover {
            background: rgba(255, 182, 193, 0.2);
            box-shadow: 0 0 40px rgba(255, 100, 150, 0.5);
        }

        .final-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 100;
            color: white;
            opacity: 0;
            transition: opacity 2s ease;
        }

        .final-message.show {
            opacity: 1;
        }

        .final-message h1 {
            font-size: 4rem;
            text-shadow: 0 0 50px rgba(255, 100, 150, 1);
            color: #ff6b9d;
            margin-bottom: 30px;
        }

        .final-message p {
            font-size: 1.5rem;
            color: #ffb6c1;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="intro" id="intro">
        <h1>A Message Written In The Stars</h1>
        <p>The universe has something to tell you...</p>
        <button onclick="startExperience()">Begin</button>
    </div>

    <div class="hint" id="hint">Find and click the glowing stars to reveal the constellation</div>

    <div class="progress" id="progress"></div>

    <div class="message" id="message">
        <h1>Will You Be My Valentine?</h1>
        <p>I wrote this message in the stars<br>because my love for you is infinite</p>
        <div class="buttons">
            <button onclick="sayYes()">Yes</button>
        </div>
    </div>

    <div class="final-message" id="finalMessage">
        <h1>To The Moon And Back</h1>
        <p>You just made my universe complete</p>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let backgroundStars = [];
        let constellationStars = [];
        let connectedStars = [];
        let shootingStars = [];
        let gameStarted = false;
        let completed = false;

        // Heart constellation points (will be scaled to screen)
        const heartShape = [
            { x: 0.5, y: 0.35 },   // top center dip
            { x: 0.38, y: 0.25 },  // left upper curve
            { x: 0.28, y: 0.30 },  // left top
            { x: 0.25, y: 0.42 },  // left middle
            { x: 0.32, y: 0.55 },  // left lower
            { x: 0.5, y: 0.75 },   // bottom point
            { x: 0.68, y: 0.55 },  // right lower
            { x: 0.75, y: 0.42 },  // right middle
            { x: 0.72, y: 0.30 },  // right top
            { x: 0.62, y: 0.25 },  // right upper curve
        ];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initStars();
        }

        function initStars() {
            // Background stars
            backgroundStars = [];
            for (let i = 0; i < 300; i++) {
                backgroundStars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    size: Math.random() * 1.5 + 0.5,
                    twinkleSpeed: Math.random() * 0.02 + 0.01,
                    twinkleOffset: Math.random() * Math.PI * 2
                });
            }

            // Constellation stars (heart shape)
            constellationStars = heartShape.map((point, index) => ({
                x: point.x * width,
                y: point.y * height,
                size: 4,
                glowSize: 20,
                index: index,
                active: index === 0, // Only first star is active initially
                connected: false,
                pulseOffset: Math.random() * Math.PI * 2
            }));
        }

        function drawBackgroundStars(time) {
            backgroundStars.forEach(star => {
                const twinkle = Math.sin(time * star.twinkleSpeed + star.twinkleOffset) * 0.5 + 0.5;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${0.3 + twinkle * 0.7})`;
                ctx.fill();
            });
        }

        function drawConstellationStars(time) {
            if (!gameStarted) return;

            constellationStars.forEach(star => {
                if (star.connected) {
                    // Connected star - solid glow
                    const gradient = ctx.createRadialGradient(star.x, star.y, 0, star.x, star.y, star.glowSize);
                    gradient.addColorStop(0, 'rgba(255, 182, 193, 1)');
                    gradient.addColorStop(0.5, 'rgba(255, 100, 150, 0.5)');
                    gradient.addColorStop(1, 'rgba(255, 100, 150, 0)');
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.glowSize, 0, Math.PI * 2);
                    ctx.fillStyle = gradient;
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    ctx.fillStyle = '#fff';
                    ctx.fill();
                } else if (star.active) {
                    // Active star - pulsing glow to indicate clickable
                    const pulse = Math.sin(time * 0.003 + star.pulseOffset) * 0.5 + 0.5;
                    const glowRadius = star.glowSize + pulse * 15;

                    const gradient = ctx.createRadialGradient(star.x, star.y, 0, star.x, star.y, glowRadius);
                    gradient.addColorStop(0, 'rgba(255, 223, 186, 1)');
                    gradient.addColorStop(0.3, 'rgba(255, 200, 150, 0.8)');
                    gradient.addColorStop(0.6, 'rgba(255, 150, 100, 0.3)');
                    gradient.addColorStop(1, 'rgba(255, 100, 50, 0)');
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, glowRadius, 0, Math.PI * 2);
                    ctx.fillStyle = gradient;
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size + pulse * 2, 0, Math.PI * 2);
                    ctx.fillStyle = '#fffaf0';
                    ctx.fill();
                }
            });
        }

        function drawConnections() {
            if (connectedStars.length < 2) return;

            ctx.beginPath();
            ctx.moveTo(connectedStars[0].x, connectedStars[0].y);

            for (let i = 1; i < connectedStars.length; i++) {
                ctx.lineTo(connectedStars[i].x, connectedStars[i].y);
            }

            // Close the heart if complete
            if (completed) {
                ctx.lineTo(connectedStars[0].x, connectedStars[0].y);
            }

            ctx.strokeStyle = 'rgba(255, 182, 193, 0.8)';
            ctx.lineWidth = 2;
            ctx.shadowColor = 'rgba(255, 100, 150, 0.8)';
            ctx.shadowBlur = 10;
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        function drawShootingStars(time) {
            // Randomly create shooting stars
            if (Math.random() < 0.005) {
                shootingStars.push({
                    x: Math.random() * width,
                    y: 0,
                    length: Math.random() * 80 + 50,
                    speed: Math.random() * 8 + 5,
                    angle: Math.PI / 4 + (Math.random() - 0.5) * 0.5
                });
            }

            shootingStars = shootingStars.filter(star => {
                star.x += Math.cos(star.angle) * star.speed;
                star.y += Math.sin(star.angle) * star.speed;

                const gradient = ctx.createLinearGradient(
                    star.x, star.y,
                    star.x - Math.cos(star.angle) * star.length,
                    star.y - Math.sin(star.angle) * star.length
                );
                gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
                gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

                ctx.beginPath();
                ctx.moveTo(star.x, star.y);
                ctx.lineTo(
                    star.x - Math.cos(star.angle) * star.length,
                    star.y - Math.sin(star.angle) * star.length
                );
                ctx.strokeStyle = gradient;
                ctx.lineWidth = 2;
                ctx.stroke();

                return star.x < width + 100 && star.y < height + 100;
            });
        }

        function drawAurora(time) {
            if (!completed) return;

            const gradient = ctx.createLinearGradient(0, height * 0.3, 0, height);
            gradient.addColorStop(0, 'rgba(255, 100, 150, 0)');
            gradient.addColorStop(0.5, `rgba(255, 100, 150, ${0.1 + Math.sin(time * 0.001) * 0.05})`);
            gradient.addColorStop(1, 'rgba(255, 100, 150, 0)');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
        }

        function animate(time) {
            ctx.fillStyle = 'rgba(10, 10, 26, 1)';
            ctx.fillRect(0, 0, width, height);

            drawAurora(time);
            drawBackgroundStars(time);
            drawShootingStars(time);
            drawConnections();
            drawConstellationStars(time);

            requestAnimationFrame(animate);
        }

        function handleClick(e) {
            if (!gameStarted || completed) return;

            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            constellationStars.forEach(star => {
                if (!star.active || star.connected) return;

                const distance = Math.sqrt(
                    Math.pow(clickX - star.x, 2) + Math.pow(clickY - star.y, 2)
                );

                if (distance < star.glowSize + 10) {
                    star.connected = true;
                    connectedStars.push(star);

                    // Activate next star
                    const nextIndex = (star.index + 1) % constellationStars.length;
                    if (nextIndex !== 0 || connectedStars.length === constellationStars.length - 1) {
                        const nextStar = constellationStars.find(s => s.index === nextIndex);
                        if (nextStar && !nextStar.connected) {
                            nextStar.active = true;
                        }
                    }

                    updateProgress();

                    // Check if complete
                    if (connectedStars.length === constellationStars.length) {
                        completeConstellation();
                    }
                }
            });
        }

        function updateProgress() {
            const progress = document.getElementById('progress');
            progress.textContent = `Stars Connected: ${connectedStars.length} / ${constellationStars.length}`;
        }

        function startExperience() {
            document.getElementById('intro').classList.add('hidden');
            document.getElementById('hint').style.opacity = '1';
            gameStarted = true;
            updateProgress();

            // Fade out hint after 5 seconds
            setTimeout(() => {
                document.getElementById('hint').style.opacity = '0';
            }, 5000);
        }

        function completeConstellation() {
            completed = true;
            document.getElementById('hint').classList.add('hidden');
            document.getElementById('progress').classList.add('hidden');

            setTimeout(() => {
                document.getElementById('message').classList.add('show');
            }, 1500);
        }

        function sayYes() {
            document.getElementById('message').classList.remove('show');
            document.getElementById('message').classList.add('hidden');

            setTimeout(() => {
                document.getElementById('finalMessage').classList.add('show');
                createCelebration();
            }, 500);
        }

        function createCelebration() {
            // Add extra shooting stars for celebration
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    shootingStars.push({
                        x: Math.random() * width,
                        y: 0,
                        length: Math.random() * 100 + 80,
                        speed: Math.random() * 10 + 8,
                        angle: Math.PI / 4 + (Math.random() - 0.5) * 0.8
                    });
                }, i * 200);
            }
        }

        // Initialize
        window.addEventListener('resize', resize);
        canvas.addEventListener('click', handleClick);
        resize();
        animate(0);
    </script>
</body>
</html>
